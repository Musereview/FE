# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ko-KR'
early_access: false
reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
  path_filters:
    - '!dist/**'
    - '!node_modules/**'
    - '!public/**'
    - '!package-lock.json'
    - '!**/*.min.js'
  tools:
    eslint:
      enabled: true
chat:
  auto_reply: false
